<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Ma galerie photos</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f2f2f2;
            color: #222;
        }

        header {
            text-align: center;
            padding: 30px 15px 20px;
            background: white;
        }

        header h1 {
            margin: 0 0 8px;
        }

        header p {
            margin: 0;
            color: #666;
        }

        .galerie {
            max-width: 1200px;
            margin: auto;
            padding: 25px;

            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
            gap: 18px;
        }

        .photo {
            background: white;
            border-radius: 10px;
            overflow: hidden;

            box-shadow: 0 2px 8px rgba(0,0,0,0.15);

            cursor: pointer;

            transition: transform 0.2s;
        }

        .photo:hover {
            transform: scale(1.02);
        }

        .photo img {
            width: 100%;
            height: 220px;

            object-fit: cover;

            display: block;
        }

        .legende {
            padding: 10px;
            text-align: center;
            font-size: 14px;
        }


        /* Fenêtre d'affichage plein écran */

        .lightbox {

            display: none;

            position: fixed;

            z-index: 1000;

            left: 0;
            top: 0;

            width: 100%;
            height: 100%;

            background: rgba(0,0,0,0.92);

            justify-content: center;
            align-items: center;

            flex-direction: column;
        }


        .lightbox img {

            max-width: 90%;
            max-height: 75vh;

            object-fit: contain;
        }


        .fermer {

            position: absolute;

            top: 20px;
            right: 30px;

            font-size: 40px;
            color: white;

            cursor: pointer;
        }


        .precedent,
        .suivant {

            position: absolute;

            top: 50%;

            font-size: 50px;

            color: white;

            cursor: pointer;

            user-select: none;
        }


        .precedent {
            left: 25px;
        }


        .suivant {
            right: 25px;
        }


        .boutons {

            margin-top: 20px;

            text-align: center;
        }


        .boutons a {

            display: inline-block;

            padding: 12px 20px;

            background: white;

            color: black;

            text-decoration: none;

            border-radius: 6px;

            margin: 5px;
        }


        #compteur {

            color: white;

            margin-top: 12px;
        }


        @media (max-width: 600px) {

            .galerie {

                grid-template-columns: repeat(2, 1fr);

                padding: 10px;

                gap: 8px;
            }

            .photo img {

                height: 160px;
            }

            .precedent,
            .suivant {

                font-size: 35px;
            }

        }

    </style>

</head>


<body>


<header>

    <h1>Photos & vidéos</h1>

    <p>Cliquez sur une photo pour l'agrandir</p>

</header>



<div class="galerie" id="galerie"></div>



<div class="lightbox" id="lightbox">


    <div class="fermer" onclick="fermerLightbox()">

        &times;

    </div>


    <div class="precedent" onclick="photoPrecedente()">

        &#10094;

    </div>


    <img id="imageGrande">


    <div class="suivant" onclick="photoSuivante()">

        &#10095;

    </div>


    <div id="compteur"></div>


    <div class="boutons">

        <a id="lienOriginal"
           href="#"
           target="_blank">

            Ouvrir / télécharger

        </a>

    </div>


</div>



<script>


/*
---------------------------------------------------
LISTE DES PHOTOS
---------------------------------------------------

Pour ajouter des photos plus tard,
nous ajouterons simplement de nouvelles lignes ici.

*/


const photos = [

    {

        nom: "Photo 1",

        url:
        "https://1drv.ms/i/c/b1014bde318d1199/IQTKE9iWywieS7omS9mlGglGAayYn0PFoYBgkCHOcdC_FQk"

    }

];



let photoActuelle = 0;



const galerie = document.getElementById("galerie");



function construireGalerie() {


    galerie.innerHTML = "";


    photos.forEach((photo, index) => {


        const bloc = document.createElement("div");

        bloc.className = "photo";


        bloc.onclick = function() {

            ouvrirLightbox(index);

        };


        const image = document.createElement("img");

        image.src = photo.url;

        image.alt = photo.nom;

        image.loading = "lazy";


        const legende = document.createElement("div");

        legende.className = "legende";

        legende.textContent = photo.nom;


        bloc.appendChild(image);

        bloc.appendChild(legende);


        galerie.appendChild(bloc);


    });

}



function ouvrirLightbox(index) {


    photoActuelle = index;


    afficherPhoto();


    document.getElementById("lightbox").style.display = "flex";

}



function fermerLightbox() {


    document.getElementById("lightbox").style.display = "none";

}



function afficherPhoto() {


    const photo = photos[photoActuelle];


    document.getElementById("imageGrande").src = photo.url;


    document.getElementById("lienOriginal").href = photo.url;


    document.getElementById("compteur").textContent =

        (photoActuelle + 1)

        + " / "

        + photos.length;

}



function photoSuivante() {


    photoActuelle++;


    if (photoActuelle >= photos.length) {

        photoActuelle = 0;

    }


    afficherPhoto();

}



function photoPrecedente() {


    photoActuelle--;


    if (photoActuelle < 0) {

        photoActuelle = photos.length - 1;

    }


    afficherPhoto();

}



/*
Navigation clavier
*/


document.addEventListener("keydown", function(event) {


    if (event.key === "Escape") {

        fermerLightbox();

    }


    if (event.key === "ArrowRight") {

        photoSuivante();

    }


    if (event.key === "ArrowLeft") {

        photoPrecedente();

    }


});



construireGalerie();


</script>


</body>

</html>
